[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "character-consistency-lab"
version = "0.1.0"
description = "Tools and experiments for character identity consistency across generated images."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10,<12",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
inference = [
  "diffusers>=0.35,<1",
  "torch>=2.4,<3",
  "transformers>=4.44,<6",
  "accelerate>=1,<2",
  "safetensors>=0.4,<1",
]

[project.scripts]
character-lab = "character_consistency_lab.cli:main"
ccl-manifest = "character_consistency_lab.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
